<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Velocity</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="styles.css">

</head>

<body class="w-screen h-screen relative">

<div id="ui-layer" class="absolute top-6 left-6 right-6 flex justify-between pointer-events-none z-10">

<div class="text-cyan-400 font-bold text-xl neon-text">
SCORE: <span id="score">0</span>
</div>

<div class="text-pink-500 font-bold text-xl neon-text-pink">
SPEED: <span id="speed-val">1.0</span>x
</div>

</div>

<canvas id="gameCanvas"></canvas>

<div id="game-over"
class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center text-center p-6 z-20">

<h1 class="text-6xl font-black text-pink-600 mb-4 neon-text-pink">
CRASHED!
</h1>

<p id="final-score" class="text-white text-2xl mb-8">
Final Score: 0
</p>

<button onclick="location.reload()"
class="px-8 py-4 bg-cyan-500 text-black text-xl font-bold rounded-full hover:bg-cyan-400">

RESTART

</button>

</div>

<script src="script.js"></script>

</body>
</html>
